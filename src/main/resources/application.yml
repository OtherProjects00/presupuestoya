spring:
  application:
    name: presupuestoya
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/presupuestoya;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: true
  web:
    locale: es_AR
    locale-resolver: fixed
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PRESUPUESTOYA_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  public-quote-days: ${PUBLIC_QUOTE_DAYS:30}
  registration-enabled: ${REGISTRATION_ENABLED:true}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-block-minutes: ${LOGIN_BLOCK_MINUTES:15}
logging:
  level:
    root: INFO
    com.presupuestoya: INFO
