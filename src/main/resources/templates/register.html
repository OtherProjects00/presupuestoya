<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Crear cuenta')}"></head>
<body class="auth-page">
<main class="auth-shell">
    <aside th:replace="~{fragments/auth-aside :: authAside('Empezá en dos minutos', 'Del primer cliente al presupuesto enviado.', 'Creá tu cuenta y armá tu primer presupuesto hoy. Sin planillas y sin instalar nada.')}"></aside>

    <section class="auth-main auth-main--wide">
        <div class="auth-top">
            <a th:href="@{/}" class="auth-back">← Volver al inicio</a>
            <span class="auth-secure">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                    <path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v9H6z" stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Conexión segura
            </span>
        </div>

        <div class="auth-form-wrap">
            <p class="eyebrow">Primer paso</p>
            <h1>Crear cuenta</h1>
            <p class="muted">Tu cuenta es personal. Cada usuario ve solo sus propios clientes y presupuestos.</p>

            <form th:action="@{/register}" th:object="${form}" method="post" class="auth-form">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error" role="alert">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                </div>

                <div class="field">
                    <label for="displayName">Tu nombre o nombre del negocio</label>
                    <input id="displayName" type="text" th:field="*{displayName}" maxlength="80" required class="input"
                           autocomplete="organization" placeholder="Ej.: Plomería Gómez">
                    <p class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></p>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" maxlength="254" required class="input"
                           autocomplete="email" placeholder="vos@tunegocio.com">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" th:field="*{password}" minlength="12" maxlength="72" required
                           class="input" autocomplete="new-password" placeholder="Mínimo 12 caracteres">
                    <p class="help">Usá una frase larga que puedas recordar.</p>
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <div class="field">
                    <label for="confirmPassword">Repetir contraseña</label>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" minlength="12" maxlength="72"
                           required class="input" autocomplete="new-password" placeholder="Repetí la misma frase">
                    <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Crear cuenta</button>
            </form>

            <p class="auth-switch">¿Ya tenés cuenta? <a th:href="@{/login}">Ingresar</a></p>
        </div>

        <p class="auth-legal">Tus datos te pertenecen. Nunca los compartimos.</p>
    </section>
</main>

<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
