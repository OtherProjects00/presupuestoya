<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Presupuesto')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container narrow">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="page-head">
        <div>
            <p class="eyebrow">Presupuestos</p>
            <h1 th:text="${quoteForm.id == null ? 'Nuevo presupuesto' : 'Editar presupuesto'}">Presupuesto</h1>
            <p class="muted" th:text="|Moneda: ${profile.currency}|">Moneda</p>
        </div>
        <a th:href="@{/app/quotes}" class="btn">Volver</a>
    </section>

    <form th:action="@{/app/quotes/save}" th:object="${quoteForm}" method="post" class="stack"
          id="quoteForm">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error" role="alert">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>

        <input type="hidden" th:field="*{id}">

        <section class="card form-card">
            <h2>Datos del trabajo</h2>

            <label for="clientId">Cliente *</label>
            <select id="clientId" th:field="*{clientId}" class="input" required>
                <option value="">Seleccioná un cliente</option>
                <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.name}"></option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}"></p>
            <p class="help">
                ¿No está tu cliente? <a th:href="@{/app/clients/new}">Cargalo primero</a> y volvé a esta pantalla.
            </p>

            <div class="form-grid">
                <div>
                    <label for="issueDate">Fecha de emisión *</label>
                    <input id="issueDate" type="date" th:field="*{issueDate}" class="input" required>
                    <p class="field-error" th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}"></p>
                </div>
                <div>
                    <label for="validUntil">Válido hasta *</label>
                    <input id="validUntil" type="date" th:field="*{validUntil}" class="input" required>
                    <p class="field-error" th:if="${#fields.hasErrors('validUntil')}" th:errors="*{validUntil}"></p>
                </div>
            </div>
        </section>

        <section class="card form-card">
            <div class="section-head">
                <h2>Ítems</h2>
                <button type="button" id="addItem" class="btn btn-small">Agregar ítem</button>
            </div>

            <div class="table-wrap items-wrap">
                <table class="items-table">
                    <thead>
                    <tr>
                        <th>Descripción</th>
                        <th class="col-qty">Cantidad</th>
                        <th class="col-price">Precio unitario</th>
                        <th class="col-total">Subtotal</th>
                        <th class="col-action"></th>
                    </tr>
                    </thead>
                    <tbody id="itemsBody">
                    <tr th:each="item, stat : ${quoteForm.items}">
                        <td data-label="Descripción">
                            <input type="text"
                                   th:field="*{items[__${stat.index}__].description}"
                                   maxlength="200"
                                   class="input"
                                   placeholder="Ej.: Cambio de grifería">
                        </td>
                        <td data-label="Cantidad">
                            <input type="number" step="0.01" min="0.01"
                                   th:field="*{items[__${stat.index}__].quantity}"
                                   class="input num">
                        </td>
                        <td data-label="Precio unitario">
                            <input type="number" step="0.01" min="0"
                                   th:field="*{items[__${stat.index}__].unitPrice}"
                                   class="input num"
                                   placeholder="0,00">
                        </td>
                        <td class="line-total" data-label="Subtotal" data-line-total>—</td>
                        <td>
                            <button type="button" class="btn-icon remove-item" aria-label="Quitar ítem">×</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="quote-calc">
                <div class="tax-field">
                    <label for="taxRate">IVA (%)</label>
                    <input id="taxRate" type="number" step="0.01" min="0" max="100" th:field="*{taxRate}"
                           class="input input-short">
                    <p class="field-error" th:if="${#fields.hasErrors('taxRate')}" th:errors="*{taxRate}"></p>
                </div>

                <div class="totals quote-totals" aria-live="polite">
                    <div><span>Subtotal</span><strong><span th:text="${profile.currency}">ARS</span> <span data-subtotal>0,00</span></strong></div>
                    <div><span>IVA <span id="taxRateLabel">0</span>%</span><strong><span th:text="${profile.currency}">ARS</span> <span data-tax>0,00</span></strong></div>
                    <div class="grand-total"><span>Total</span><strong><span th:text="${profile.currency}">ARS</span> <span data-total>0,00</span></strong></div>
                </div>
            </div>
        </section>

        <section class="card form-card">
            <h2>Mensaje para el cliente</h2>

            <label for="notes">Observaciones</label>
            <textarea id="notes" th:field="*{notes}" maxlength="2000" rows="4" class="input"
                      placeholder="Ej.: Incluye materiales y mano de obra. No incluye roturas ocultas."></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></p>

            <label for="terms">Condiciones</label>
            <textarea id="terms" th:field="*{terms}" maxlength="2000" rows="4" class="input"
                      placeholder="Ej.: Seña del 50% para reservar fecha. Validez del presupuesto: 15 días."></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('terms')}" th:errors="*{terms}"></p>
        </section>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <span th:text="${quoteForm.id == null ? 'Guardar borrador' : 'Guardar cambios'}">Guardar</span>
            </button>
            <a th:if="${quoteForm.id == null}" th:href="@{/app/quotes}" class="btn">Cancelar</a>
            <a th:if="${quoteForm.id != null}" th:href="@{/app/quotes/{id}(id=${quoteForm.id})}" class="btn">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/app.js}" defer></script>
<script th:src="@{/js/quote-form.js}" defer></script>
</body>
</html>
