<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('No encontrado')}"></head>
<body class="auth-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="auth-container">
    <section class="auth-card">
        <p class="eyebrow">Error 404</p>
        <h1>No encontramos eso</h1>
        <p class="muted" th:text="${message != null ? message : 'El presupuesto no existe o el enlace venció.'}">
            El presupuesto no existe o el enlace venció.
        </p>
        <a th:href="@{/}" class="btn btn-primary btn-block">Volver al inicio</a>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
